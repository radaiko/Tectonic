<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9142"/>
      <stop offset="100%" stop-color="#ff6b1a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#2a2d35" stroke-width="4"/>

  <!-- T letterform as structural frame -->
  <g transform="translate(256,256) scale(1.6)">
    <!-- Horizontal beam of T (the structural cross-member) -->
    <rect x="-120" y="-100" width="240" height="40" rx="4" fill="url(#accent)"/>

    <!-- Vertical beam of T (the extrusion path) -->
    <rect x="-24" y="-100" width="48" height="200" rx="4" fill="url(#accent)"/>

    <!-- Dimension line below (the measurement/parametric aspect) -->
    <g stroke="#4a86c8" stroke-width="3" fill="none">
      <line x1="-130" y1="130" x2="130" y2="130"/>
      <line x1="-130" y1="120" x2="-130" y2="140"/>
      <line x1="130" y1="120" x2="130" y2="140"/>
    </g>

    <!-- Arrow tips on dimension line -->
    <polygon points="-130,130 -118,125 -118,135" fill="#4a86c8"/>
    <polygon points="130,130 118,125 118,135" fill="#4a86c8"/>

    <!-- Small dimension value indicator -->
    <rect x="-18" y="116" width="36" height="14" rx="2" fill="#4a86c8" opacity="0.2"/>
  </g>

  <!-- Outer decorative corner brackets (CAD reference marks) -->
  <g stroke="#2a2d35" stroke-width="6" fill="none">
    <!-- Top-left -->
    <path d="M56,72 L56,56 L72,56"/>
    <!-- Top-right -->
    <path d="M456,56 L440,56 L440,72"/>
    <!-- Bottom-left -->
    <path d="M56,440 L56,456 L72,456"/>
    <!-- Bottom-right -->
    <path d="M456,456 L440,456 L440,440"/>
  </g>
</svg>